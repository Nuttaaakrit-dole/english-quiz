<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N-NET English Quiz Level 1 (Set 5)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand-color: #2563eb;
    --brand-dark: #1e40af;
    --bg-light: #f8fafc;
    --text-main: #1e293b;
    --success: #16a34a;
    --danger: #dc2626;
  }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg-light); color: var(--text-main); padding: 20px 10px; }
  .container { max-width: 700px; margin: 0 auto; }
  
  /* Landing Page Style */
  .welcome-card { background: white; border-radius: 20px; padding: 40px 20px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 2px solid #e2e8f0; }
  .emoji-header { font-size: 70px; margin-bottom: 20px; }
  .title { font-size: 24px; font-weight: 700; color: var(--brand-color); margin-bottom: 10px; }
  .desc { font-size: 16px; color: #64748b; margin-bottom: 30px; }
  
  .input-group { margin-bottom: 15px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
  .input-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
  .input-field { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 16px; transition: 0.3s; }
  .input-field:focus { outline: none; border-color: var(--brand-color); }

  .btn { display: inline-block; padding: 14px 32px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 16px; width: 100%; }
  .btn-start { background: var(--brand-color); color: white; }
  .btn-start:hover { background: var(--brand-dark); transform: translateY(-2px); }

  /* Quiz Style */
  .quiz-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
  .progress-info { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; font-weight: 600; color: var(--brand-color); }
  .question-box { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #0f172a; line-height: 1.5; }
  .options-grid { display: grid; gap: 12px; }
  .option { padding: 15px; border: 2px solid #f1f5f9; border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: 500; }
  .option:hover { background: #f1f5f9; border-color: #cbd5e1; }
  .option.selected { background: #eff6ff; border-color: var(--brand-color); color: var(--brand-color); }
  .option.correct { background: #dcfce7; border-color: var(--success); color: var(--success); }
  .option.wrong { background: #fee2e2; border-color: var(--danger); color: var(--danger); }

  .feedback { margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 14px; display: none; line-height: 1.4; }
  .feedback.show { display: block; }
  .nav-btns { margin-top: 20px; display: flex; gap: 10px; }

  /* Summary */
  .summary-box { display: none; background: white; padding: 30px; border-radius: 20px; text-align: center; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--brand-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; margin: 0 auto 20px; border: 5px solid #bfdbfe; }
</style>
</head>
<body>

<div class="container">
  <!-- หน้าแรก (Landing) -->
  <div id="landing" class="welcome-card">
    <div class="emoji-header">🇬🇧 ✈️ 📖 🏫</div>
    <h1 class="title">สกร.โนนสัง ระดับประถมศึกษา - วิชาภาษาอังกฤษ</h1>
    <p class="desc">แบบทดสอบ N-NET ชุดที่ 5: ท้าทายการสื่อสารและการวิเคราะห์</p>
    
    <div class="input-group">
      <label>ชื่อ-นามสกุล นักศึกษา:</label>
      <input type="text" id="studentName" class="input-field" placeholder="กรอกชื่อของคุณ">
    </div>
    
    <div class="input-group">
      <button class="btn btn-start" onclick="startQuiz()">เริ่มทำแบบทดสอบ 🚀</button>
    </div>
    <p style="font-size: 12px; color: #94a3b8;">* ชุดข้อสอบเน้นการประยุกต์ใช้เนื้อหาระดับยากขึ้น *</p>
  </div>

  <!-- หน้าข้อสอบ -->
  <div id="quizContainer" class="quiz-card">
    <div class="progress-info">
      <span id="qNumber">Question 1/20</span>
      <span id="timer">วิชาภาษาอังกฤษ (ชุดที่ 5)</span>
    </div>
    <div id="questionText" class="question-box"></div>
    <div id="options" class="options-grid"></div>
    <div id="feedback" class="feedback"></div>
    <div class="nav-btns">
      <button id="nextBtn" class="btn btn-start" style="display:none;" onclick="nextQuestion()">ข้อถัดไป ➡️</button>
    </div>
  </div>

  <!-- หน้าสรุปผล -->
  <div id="summary" class="summary-box">
    <h2 class="title">สรุปคะแนนสอบของคุณ</h2>
    <div id="studentDisplay" style="margin-bottom: 10px; font-weight: 600;"></div>
    <div class="score-circle" id="scoreValue">0/20</div>
    <p id="gradeMsg" style="margin-bottom: 20px; font-weight: 700;"></p>
    <button class="btn btn-start" onclick="location.reload()">ทำใหม่อีกครั้ง 🔄</button>
  </div>
</div>

<script>
const quizData = [
  {
    q: "Situation: At the library. \nStaff: Please keep quiet in this area. \nStudent: _________",
    a: [
      { t: "I'm sorry. I'll be quiet.", c: true, r: "ถูกต้อง เมื่อได้รับคำเตือนให้เงียบ ควรตอบรับด้วยการขอโทษและปฏิบัติตาม" },
      { t: "You're welcome.", c: false, r: "ตัวลวง: ใช้ตอบเมื่อมีคนขอบคุณ ไม่ใช่เมื่อได้รับคำเตือน" },
      { t: "Never mind.", c: false, r: "ตัวลวง: ใช้เมื่อไม่ถือสา แต่อันนี้เป็นคำสั่ง/ข้อห้าม" },
      { t: "Thank you for the noise.", c: false, r: "ตัวลวง: ความหมายผิดเพี้ยน" }
    ]
  },
  {
    q: "Look at the sign: [No Food or Drink]. \nWhere can you see this sign?",
    a: [
      { t: "In a computer lab", c: true, r: "ถูกต้อง ห้องคอมพิวเตอร์มักห้ามนำอาหารและเครื่องดื่มเข้าไปเพื่อป้องกันความเสียหาย" },
      { t: "In a restaurant", c: false, r: "ตัวลวง: ร้านอาหารเป็นที่ที่มีอาหารอยู่แล้ว" },
      { t: "In a kitchen", c: false, r: "ตัวลวง: ห้องครัวคือที่ประกอบอาหาร" },
      { t: "In a food court", c: false, r: "ตัวลวง: ศูนย์อาหารอนุญาตให้ทานได้" }
    ]
  },
  {
    q: "Stranger: Excuse me, how can I get to the hospital? \nYou: _________ It's next to the post office.",
    a: [
      { t: "Go straight for two blocks.", c: true, r: "ถูกต้อง เป็นการบอกทางที่ชัดเจนที่สุดตามบริบท" },
      { t: "I'm going to the hospital.", c: false, r: "ตัวลวง: เป็นการบอกเรื่องของตัวเอง ไม่ใช่การบอกทางให้เขา" },
      { t: "The hospital is far away.", c: false, r: "ตัวลวง: บอกแค่ไกลแต่ไม่ได้บอกวิธีไป" },
      { t: "Yes, I like the hospital.", c: false, r: "ตัวลวง: ไม่ตรงประเด็นคำถาม How" }
    ]
  },
  {
    q: "Which sentence is grammatically correct?",
    a: [
      { t: "She usually goes to school by bus.", c: true, r: "ถูกต้อง ประธานเป็นเอกพจน์ (She) กริยาเติม -es (goes) และมีคำวิเศษณ์บอกความถี่" },
      { t: "She usually go to school by bus.", c: false, r: "ตัวลวง: ลืมเติม -es ที่กริยา" },
      { t: "She go usually to school by bus.", c: false, r: "ตัวลวง: วางตำแหน่ง adverb ผิด" },
      { t: "She is go to school by bus.", c: false, r: "ตัวลวง: ใช้กริยาซ้อนกันผิดหลัก" }
    ]
  },
  {
    q: "A: What _________ your hobby? \nB: My hobbies _________ reading and swimming.",
    a: [
      { t: "is / are", c: true, r: "ถูกต้อง Hobby แรกเป็นเอกพจน์ใช้ is ส่วนคำตอบพูดถึง 2 กิจกรรมใช้ are" },
      { t: "are / is", c: false, r: "ตัวลวง: สลับพจน์กัน" },
      { t: "is / is", c: false, r: "ตัวลวง: คำตอบหลังเป็นพหูพจน์ (reading & swimming)" },
      { t: "am / are", c: false, r: "ตัวลวง: am ใช้กับ I เท่านั้น" }
    ]
  },
  {
    q: "Jane: Why are you late today? \nMark: _________ The traffic was very heavy.",
    a: [
      { t: "Because I missed the bus.", c: true, r: "ถูกต้อง เพราะคำถามถาม Why (ทำไม) จึงต้องตอบด้วยเหตุผล Because" },
      { t: "Yes, I am late.", c: false, r: "ตัวลวง: คำถาม Why ห้ามตอบ Yes/No" },
      { t: "I am late every day.", c: false, r: "ตัวลวง: ไม่ใช่การบอกสาเหตุที่มาสายวันนี้" },
      { t: "At 8 o'clock.", c: false, r: "ตัวลวง: เป็นการบอกเวลา (When) ไม่ใช่เหตุผล" }
    ]
  },
  {
    q: "If you want to borrow a pen from your teacher, you should say: \n\"_________ I borrow your pen, please?\"",
    a: [
      { t: "May", c: true, r: "ถูกต้อง 'May' เป็นคำสุภาพที่สุดในการขออนุญาต" },
      { t: "Must", c: false, r: "ตัวลวง: แปลว่าต้อง (เป็นคำสั่ง)" },
      { t: "Do", c: false, r: "ตัวลวง: ไม่สุภาพเท่า May ในบริบทนี้" },
      { t: "Will", c: false, r: "ตัวลวง: เป็นการถามถึงอนาคต ไม่ใช่การขออนุญาต" }
    ]
  },
  {
    q: "Look at the price: [Apple - 3 for 100 Baht]. \nIf you buy 6 apples, how much will you pay?",
    a: [
      { t: "Two hundred Baht", c: true, r: "ถูกต้อง 3 ผล 100 บาท ถ้า 6 ผลต้องจ่าย 200 บาท (ท้าทายการคำนวณภาษาอังกฤษ)" },
      { t: "One hundred Baht", c: false, r: "ตัวลวง: จำนวนไม่พอ" },
      { t: "Three hundred Baht", c: false, r: "ตัวลวง: คำนวณผิด" },
      { t: "Six hundred Baht", c: false, r: "ตัวลวง: นำจำนวนผลไปคูณราคาตรงๆ" }
    ]
  },
  {
    q: "What does the word 'Desert' mean in this sentence? \n\"Camels can live in the desert for a long time.\"",
    a: [
      { t: "A dry, sandy area", c: true, r: "ถูกต้อง Desert ในบริบทอูฐหมายถึงทะเลทราย" },
      { t: "Sweet food after a meal", c: false, r: "ตัวลวง: อันนั้นคือ Dessert (มี s 2 ตัว)" },
      { t: "A thick forest", c: false, r: "ตัวลวง: ความหมายตรงข้ามกัน" },
      { t: "A cold place with snow", c: false, r: "ตัวลวง: ความหมายผิด" }
    ]
  },
  {
    q: "A: What's the weather like today? \nB: _________ You should take an umbrella.",
    a: [
      { t: "It's rainy.", c: true, r: "ถูกต้อง เพราะคำเตือนบอกให้พกร่ม (umbrella)" },
      { t: "It's sunny.", c: false, r: "ตัวลวง: แดดออกมักไม่ต้องใช้ร่มเท่าฝนตก (ในบริบทข้อสอบทั่วไป)" },
      { t: "It's very hot.", c: false, r: "ตัวลวง: ร้อนมักใช้หมวกหรือแว่นกันแดด" },
      { t: "It's cold.", c: false, r: "ตัวลวง: หนาวใช้เสื้อกันหนาว" }
    ]
  },
  {
    q: "Which word has a different vowel sound? (คำไหนเสียงสระต่างจากพวก)",
    a: [
      { t: "Fly", c: true, r: "ถูกต้อง Fly ออกเสียงสระไอ /ai/ ในขณะที่ข้ออื่นออกเสียงอี /ee/" },
      { t: "Bee", c: false, r: "เสียงสระอี" },
      { t: "Tree", c: false, r: "เสียงสระอี" },
      { t: "See", c: false, r: "เสียงสระอี" }
    ]
  },
  {
    q: "Situation: You walk into a shop. \nShopkeeper: May I help you? \nYou: _________",
    a: [
      { t: "Yes, I'm looking for a t-shirt.", c: true, r: "ถูกต้อง เป็นการตอบรับความช่วยเหลืออย่างสุภาพ" },
      { t: "No, you may not.", c: false, r: "ตัวลวง: ปฏิเสธรุนแรงและไม่สุภาพ" },
      { t: "Fine, thank you.", c: false, r: "ตัวลวง: ใช้ตอบ How are you?" },
      { t: "I help you too.", c: false, r: "ตัวลวง: ความหมายผิด" }
    ]
  },
  {
    q: "Choose the correct order: \n\"black / has / a / He / cat / small\"",
    a: [
      { t: "He has a small black cat.", c: true, r: "ถูกต้อง ลำดับคือ ประธาน + กริยา + ขนาด + สี + นาม" },
      { t: "He has a black small cat.", c: false, r: "ตัวลวง: สลับตำแหน่งขนาดกับสี" },
      { t: "A small black cat he has.", c: false, r: "ตัวลวง: ลำดับประโยคผิด" },
      { t: "He a small black cat has.", c: false, r: "ตัวลวง: วางกริยาผิดที่" }
    ]
  },
  {
    q: "Which month comes after August?",
    a: [
      { t: "September", c: true, r: "ถูกต้อง สิงหาคม (August) แล้วตามด้วย กันยายน (September)" },
      { t: "July", c: false, r: "ตัวลวง: มาก่อนสิงหาคม" },
      { t: "October", c: false, r: "ตัวลวง: ลำดับถัดไปอีก 1 เดือน" },
      { t: "June", c: false, r: "ตัวลวง: มาก่อนกรกฎาคม" }
    ]
  },
  {
    q: "A: Happy Birthday! This is for you. \nB: _________",
    a: [
      { t: "Oh, it's beautiful! Thank you.", c: true, r: "ถูกต้อง เมื่อได้รับของขวัญควรแสดงความดีใจและขอบคุณ" },
      { t: "Happy Birthday to you too.", c: false, r: "ตัวลวง: คนให้ไม่ได้เกิดวันนี้" },
      { t: "I'm sorry.", c: false, r: "ตัวลวง: ไม่ใช่สถานการณ์น่าเสียใจ" },
      { t: "Congratulations.", c: false, r: "ตัวลวง: ใช้เมื่อคนอื่นสำเร็จอะไรบางอย่าง" }
    ]
  },
  {
    q: "My father is a _________. He grows vegetables and rice.",
    a: [
      { t: "farmer", c: true, r: "ถูกต้อง คนปลูกผักและข้าวคือชาวนา/เกษตรกร" },
      { t: "teacher", c: false, r: "ตัวลวง: อาชีพครู" },
      { t: "doctor", c: false, r: "ตัวลวง: อาชีพหมอ" },
      { t: "cook", c: false, r: "ตัวลวง: อาชีพคนทำอาหาร" }
    ]
  },
  {
    q: "A: How _________ is your brother? \nB: He is 150 centimeters tall.",
    a: [
      { t: "tall", c: true, r: "ถูกต้อง คำตอบบอกความสูงเป็นเซนติเมตร คำถามต้องใช้ How tall" },
      { t: "old", c: false, r: "ตัวลวง: ถามอายุ" },
      { t: "long", c: false, r: "ตัวลวง: ถามความยาวสิ่งของ" },
      { t: "high", c: false, r: "ตัวลวง: ถามความสูงของตึกหรือภูเขา ไม่ใช้กับคน" }
    ]
  },
  {
    q: "Look at the sign: [Keep Off The Grass]. \nWhat should you do?",
    a: [
      { t: "Do not walk on the grass.", c: true, r: "ถูกต้อง ห้ามเหยียบหญ้า" },
      { t: "Plant some grass here.", c: false, r: "ตัวลวง: ให้ปลูกหญ้า" },
      { t: "Water the grass.", c: false, r: "ตัวลวง: ให้รดน้ำหญ้า" },
      { t: "Cut the grass.", c: false, r: "ตัวลวง: ให้ตัดหญ้า" }
    ]
  },
  {
    q: "Today is Monday. What was the day before yesterday?",
    a: [
      { t: "Saturday", c: true, r: "ถูกต้อง วันนี้วันจันทร์ เมื่อวานวันอาทิตย์ เมื่อวานซืน (day before yesterday) คือวันเสาร์" },
      { t: "Sunday", c: false, r: "ตัวลวง: เมื่อวาน" },
      { t: "Tuesday", c: false, r: "ตัวลวง: พรุ่งนี้" },
      { t: "Friday", c: false, r: "ตัวลวง: นับถอยหลังผิด" }
    ]
  },
  {
    q: "Which sentence is a question?",
    a: [
      { t: "Where do you live?", c: true, r: "ถูกต้อง ขึ้นต้นด้วย Wh-question และมีโครงสร้างประโยคคำถาม" },
      { t: "I live in Bangkok.", c: false, r: "ประโยคบอกเล่า" },
      { t: "Please open the door.", c: false, r: "ประโยคคำสั่ง/ขอร้อง" },
      { t: "Wow! That is great.", c: false, r: "ประโยคอุทาน" }
    ]
  }
];

let currentIdx = 0;
let score = 0;
let studentName = "";

function startQuiz() {
  const nameInput = document.getElementById('studentName').value;
  if (!nameInput) {
    alert("กรุณากรอกชื่อก่อนเริ่มสอบนะครับ");
    return;
  }
  studentName = nameInput;
  document.getElementById('landing').style.display = 'none';
  document.getElementById('quizContainer').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  const q = quizData[currentIdx];
  document.getElementById('qNumber').innerText = `Question ${currentIdx + 1}/20`;
  document.getElementById('questionText').innerText = q.q;
  
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = "";
  document.getElementById('feedback').className = "feedback";
  document.getElementById('nextBtn').style.display = "none";

  q.a.forEach((opt, index) => {
    const div = document.createElement('div');
    div.className = "option";
    div.innerText = opt.t;
    div.onclick = () => checkAnswer(index, div);
    optionsDiv.appendChild(div);
  });
}

function checkAnswer(idx, el) {
  const q = quizData[currentIdx];
  const options = document.querySelectorAll('.option');
  
  // ป้องกันการกดซ้ำ
  options.forEach(o => o.style.pointerEvents = "none");

  if (q.a[idx].c) {
    el.classList.add('correct');
    score++;
    showFeedback(true, q.a[idx].r);
  } else {
    el.classList.add('wrong');
    // โชว์ข้อที่ถูก
    q.a.forEach((opt, i) => {
      if (opt.c) options[i].classList.add('correct');
    });
    showFeedback(false, q.a[idx].r);
  }
  document.getElementById('nextBtn').style.display = "block";
}

function showFeedback(isCorrect, msg) {
  const f = document.getElementById('feedback');
  f.className = isCorrect ? "feedback show" : "feedback show";
  f.style.background = isCorrect ? "#dcfce7" : "#fee2e2";
  f.innerHTML = `<strong>${isCorrect ? '✅ Excellent!' : '❌ Incorrect'}</strong><br>${msg}`;
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < quizData.length) {
    showQuestion();
  } else {
    showSummary();
  }
}

function showSummary() {
  document.getElementById('quizContainer').style.display = 'none';
  const summary = document.getElementById('summary');
  summary.style.display = 'block';
  document.getElementById('studentDisplay').innerText = `นักศึกษา: ${studentName}`;
  document.getElementById('scoreValue').innerText = `${score}/20`;
  
  let msg = "";
  if(score >= 16) msg = "ยอดเยี่ยมมาก! คุณมีพื้นฐานภาษาอังกฤษที่ดีเยี่ยม 🌟";
  else if(score >= 10) msg = "เก่งมาก! คุณผ่านเกณฑ์พื้นฐานแล้ว พัฒนาต่อไปนะ 👏";
  else msg = "พยายามอีกนิดนะ! ลองทบทวนคำศัพท์และประโยคพื้นฐานบ่อยๆ 💪";
  document.getElementById('gradeMsg').innerText = msg;
}
</script>
